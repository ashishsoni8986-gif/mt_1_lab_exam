<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Restaurant Menu</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 margin: 40px;
 background-color: #fafafa;
 color: #333;
 }
 h1 {
 color: #d35400;
 }
 table {
width: 60%;
 border-collapse: collapse;
 margin-top: 20px;
 background: #fff;
 }
 th, td {
 border: 1px solid #ddd;
 padding: 12px;
 text-align: left;
 }
 th {
 background-color: #d35400;
 color: white;
 }
 </style>
</head>
<body>
 <h1>Our Restaurant Menu</h1>
 <p>Freshly prepared meals available for online ordering:</p>
 <table>
 <thead>
 <tr>
 <th>ID</th>
 <th>Food Name</th>
 <th>Category</th>
 <th>Price (Rs.)</th>
 </tr>
 </thead>
 <tbody>
 <tr>
 <td>1</td>
 <td>Pizza</td>
 <td>Fast Food</td>
 <td>250</td>
 </tr>
 <tr>
 <td>2</td>
 <td>Veg Burger</td>
 <td>Fast Food</td>
 <td>150</td>
 </tr>
 <tr>
 <td>3</td>
 <td>Pasta Alfredo</td>
 <td>Italian</td>
 <td>220</td>
 </tr>
 </tbody>
 </table>
</body>
</html>
